<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>어서오세요</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #212b25;
      --muted: #788179;
      --green: #426b53;
      --green-dark: #31533f;
      --paper: #fffefa;
      --line: #e8e9e1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 14% 18%, rgba(229, 231, 211, .72), transparent 32%),
        radial-gradient(ellipse at 88% 82%, rgba(222, 232, 218, .72), transparent 31%),
        #f6f4ef;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .welcome-card {
      position: relative;
      width: min(100%, 520px);
      padding: clamp(34px, 7vw, 66px);
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(53, 68, 54, .09), 0 3px 12px rgba(53, 68, 54, .04);
      text-align: center;
      animation: arrive .65s cubic-bezier(.2, .75, .25, 1) both;
    }

    .welcome-card::before {
      position: absolute;
      top: 0;
      left: 50%;
      width: 76px;
      height: 4px;
      border-radius: 0 0 6px 6px;
      background: #87a58c;
      content: "";
      transform: translateX(-50%);
    }

    .mark {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 27px;
      place-items: center;
      border-radius: 19px;
      color: var(--green);
      background: #edf2e9;
    }

    .mark svg { width: 30px; height: 30px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 36px);
      font-weight: 750;
      letter-spacing: -.06em;
      line-height: 1.35;
    }

    .description {
      margin: 12px 0 34px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      word-break: keep-all;
    }

    form { text-align: left; }

    label {
      display: block;
      margin: 0 0 10px 2px;
      color: #4d574f;
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 56px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }

    input::placeholder { color: #b0b6af; }
    input:focus { border-color: #78977f; box-shadow: 0 0 0 4px rgba(120, 151, 127, .13); }

    button {
      width: 100%;
      height: 56px;
      margin-top: 12px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: var(--green);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover { background: var(--green-dark); }
    button:active { transform: scale(.99); }
    button:focus-visible { outline: 3px solid #a6bba8; outline-offset: 3px; }

    .greeting {
      min-height: 27px;
      margin: 22px 0 0;
      color: var(--green-dark);
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.035em;
    }

    .greeting:empty { display: none; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="welcome-card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 25.5c-5.4-3.2-9-7.1-9-12.1a5.1 5.1 0 0 1 9-3.3 5.1 5.1 0 0 1 9 3.3c0 5-3.6 8.9-9 12.1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11.7 16.2c1.5.2 2.7 1.1 3.4 2.5 1.1-2.6 2.9-4.3 5.4-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="eyebrow">A WARM HELLO</p>
    <h1>반가워요, 어서오세요</h1>
    <p class="description">이름을 알려주시면 따뜻한 인사를 건넬게요.</p>

    <form id="welcome-form">
      <label for="name">이름</label>
      <div class="input-wrap">
        <input id="name" name="name" type="text" placeholder="이름을 입력해 주세요" autocomplete="name" maxlength="40" required>
      </div>
      <button type="submit">인사 받기</button>
    </form>
    <p class="greeting" id="greeting" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.querySelector('#welcome-form');
    const nameInput = document.querySelector('#name');
    const greeting = document.querySelector('#greeting');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.focus();
        return;
      }
      greeting.textContent = `${name} 님, 어서오세요`;
    });
  </script>
</body>
</html>
